actions:
  - action: install_snap
    name: test-snapd-tools-core22
    track: latest
    risk: edge
    mode: devmode
    post_commands: snap list
  - action: install_debian
    name: bluez
  - action: ssh_command
    command: |
      whoami
      date
      sudo dmesg -T | head -n 10
  - action: ssh_command
    continue_on_error: true
    command: |
      if [ "0" -eq "0" ]; then
          echo "pass"
      fi
      cat ABC.txt
      echo "all done"
  - action: scp_command
    source: enable_audio_via_alsa.py
    destination: enable_audio_via_alsa.py
  # local_command runs on the host that runs Envicorn, not on the DUT: fetch
  # or build something here, then upload it with scp_command. Same rules as
  # ssh_command (set -ex unless continue_on_error, retries on failure), so
  # write the command so a re-run exits 0 when the artifact is already there:
  # skip the download explicitly (not `wget -nc`, whose exit status for an
  # existing file differs between wget versions) and download to a .part
  # name so an interrupted transfer cannot pass the check next time.
  - action: local_command
    command: |
      mkdir -p /tmp/envicorn-downloads
      cd /tmp/envicorn-downloads
      if [ ! -f index.html ]; then
          wget -q -O index.html.part https://example.com/index.html
          mv index.html.part index.html
      fi
  - action: scp_command
    source: /tmp/envicorn-downloads/index.html
    destination: index.html
  # a whole directory goes over with recursive: true (like scp -r): here it
  # lands as /home/<user>/envicorn-downloads/ on the DUT
  - action: scp_command
    source: /tmp/envicorn-downloads
    destination: .
    recursive: true
  - action: load_template
    name: get_initial_network_info.yaml